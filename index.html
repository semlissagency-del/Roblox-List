
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RobloxList</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">
    ROBLOX<span>LIST</span>
  </div>

  <nav>
    <a href="#">Home</a>
    <a href="#games">Games</a>
    <a href="#popular">Popular</a>
  </nav>
</header>

<section class="hero">

  <h1>Discover Roblox Games</h1>

  <p>
    Find your next favorite Roblox experience.
    Browse popular games and discover new experiences.
  </p>

  <div class="search">
    <input
      id="searchBox"
      type="search"
      placeholder="Search games..."
      autocomplete="off"
    >

    <button type="button" onclick="searchGames()">
      Search
    </button>
  </div>

</section>

<main id="games">

  <div class="toolbar">

    <h2>Roblox Games</h2>

    <select id="category" onchange="filterGames()">
      <option value="all">All Categories</option>
      <option value="adventure">Adventure</option>
      <option value="simulator">Simulator</option>
      <option value="roleplay">Roleplay</option>
      <option value="horror">Horror</option>
      <option value="obby">Obby</option>
      <option value="pvp">PvP</option>
    </select>

  </div>

  <div id="gameList" class="games"></div>

</main>

<footer>
  RobloxList
</footer>

<script src="app.js"></script>

</body>
</html>
